name: Check Web Reader

on:
  workflow_call:
    inputs:
      commit:
        description: '待验证的完整提交 SHA'
        required: true
        type: string
  push:
    paths:
      - "modules/web-reader/**"
      - ".github/workflows/check-web-reader.yml"
      - ".github/workflows/build-desktop.yml"
      - ".github/workflows/deploy-web-reader.yml"
  pull_request:
    paths:
      - "modules/web-reader/**"
      - ".github/workflows/check-web-reader.yml"
      - ".github/workflows/build-desktop.yml"
      - ".github/workflows/deploy-web-reader.yml"

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: modules/web-reader/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: modules/web-reader
        run: pnpm install --frozen-lockfile
      - name: Test release orchestration
        run: node --test modules/web-reader/scripts/desktop-release.test.mjs
      - name: Test
        working-directory: modules/web-reader
        run: pnpm test
      - name: Type check
        working-directory: modules/web-reader
        run: pnpm exec vue-tsc --build --force
      - name: Build Web and verify entry boundary
        working-directory: modules/web-reader
        run: pnpm build:web
      - name: Build desktop UI
        working-directory: modules/web-reader
        run: pnpm build:desktop-ui

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: modules/web-reader/src-tauri -> target
      - name: Install Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: Check formatting
        run: cargo fmt --manifest-path modules/web-reader/src-tauri/Cargo.toml --all -- --check
      - name: Clippy
        run: cargo clippy --manifest-path modules/web-reader/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Test
        run: cargo test --manifest-path modules/web-reader/src-tauri/Cargo.toml
