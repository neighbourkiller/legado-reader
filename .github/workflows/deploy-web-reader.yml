name: Deploy Web Reader to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "modules/web-reader/**"
      - ".github/workflows/deploy-web-reader.yml"

  # 允许在 Actions 页面手动执行
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-web-reader
  cancel-in-progress: true

jobs:
  build:
    name: Build Web Reader
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 9.15.9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: modules/web-reader/pnpm-lock.yaml

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        working-directory: modules/web-reader
        run: pnpm install --frozen-lockfile

      - name: Test
        working-directory: modules/web-reader
        run: pnpm test

      - name: Type check
        working-directory: modules/web-reader
        run: pnpm exec vue-tsc --build --force

      - name: Build
        working-directory: modules/web-reader
        run: pnpm exec vite build --mode web --base="${{ steps.pages.outputs.base_path }}/"

      - name: Verify Web entry boundary
        working-directory: modules/web-reader
        run: pnpm check:web-entry

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: modules/web-reader/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
