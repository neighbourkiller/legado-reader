name: Publish Desktop Release

on:
  # 推送 reader-v* 标签时自动发布
  push:
    tags:
      - "reader-v*"

  # 也允许在 GitHub Actions 页面手动执行
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Build (${{ matrix.name }})

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (deb, rpm, tar.gz)
          - name: Linux x64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: "--bundles deb,rpm"

          # Windows x86_64 (msi, portable exe)
          - name: Windows x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: "--bundles msi"

    runs-on: ${{ matrix.platform }}

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7

      # ------------------------------------------------------------
      # pnpm
      # ------------------------------------------------------------
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 9.15.9
          run_install: false

      # ------------------------------------------------------------
      # Node.js
      # ------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: modules/web-reader/pnpm-lock.yaml

      # ------------------------------------------------------------
      # Rust
      # ------------------------------------------------------------
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      # ------------------------------------------------------------
      # Rust cache
      # ------------------------------------------------------------
      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            modules/web-reader/src-tauri -> target

      # ------------------------------------------------------------
      # Linux dependencies
      # Tauri 2 使用 WebKitGTK 4.1，打包 rpm 需要 rpm 工具
      # ------------------------------------------------------------
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            rpm

      # ------------------------------------------------------------
      # Frontend dependencies
      # ------------------------------------------------------------
      - name: Install frontend dependencies
        working-directory: modules/web-reader
        run: pnpm install --frozen-lockfile

      - name: Check Rust formatting
        working-directory: modules/web-reader
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Run Rust Clippy
        working-directory: modules/web-reader
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --target ${{ matrix.target }} -- -D warnings

      - name: Run Rust tests
        working-directory: modules/web-reader
        run: cargo test --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}

      # ------------------------------------------------------------
      # Build Tauri + Publish GitHub Release
      # ------------------------------------------------------------
      - name: Build and publish desktop application
        uses: tauri-apps/tauri-action@v1.0.0

        env:
          # GitHub 自动提供，无需自己创建 Secret
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Linux 构建时禁止 strip
          # 避免部分 Runner 环境下 strip ELF 失败
          NO_STRIP: ${{ runner.os == 'Linux' && 'true' || '' }}

        with:
          # 当前仓库是 monorepo，Tauri 项目不在仓库根目录
          projectPath: modules/web-reader

          # __VERSION__ 自动读取 tauri.conf.json 中的 version
          tagName: reader-v__VERSION__

          # GitHub Release 名称
          releaseName: "Legado Reader v__VERSION__"

          # 由 GitHub 自动生成 Release Notes
          generateReleaseNotes: true

          # false = 构建成功后直接公开发布
          releaseDraft: false

          # 正式版
          prerelease: false

          # Linux: --bundles deb,rpm
          # Windows: --bundles msi
          args: ${{ matrix.args }}

      # ------------------------------------------------------------
      # Linux tar.gz archive
      # ------------------------------------------------------------
      - name: Prepare Linux tar.gz archive
        if: runner.os == 'Linux'
        id: linux-archive
        run: |
          VERSION=$(jq -r .version modules/web-reader/src-tauri/tauri.conf.json)
          SOURCE="modules/web-reader/src-tauri/target/release/legado-reader"
          OUTPUT="Legado.Reader_${VERSION}_linux-x64.tar.gz"

          if [ ! -f "$SOURCE" ]; then
            echo "Binary not found: $SOURCE"
            exit 1
          fi

          tar -czvf "$OUTPUT" -C "modules/web-reader/src-tauri/target/release" legado-reader
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "file=$OUTPUT" >> $GITHUB_OUTPUT

      # ------------------------------------------------------------
      # Upload Linux tar.gz archive
      # 上传到 tauri-action 创建的同一个 GitHub Release
      # ------------------------------------------------------------
      - name: Upload Linux tar.gz archive
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload \
            "reader-v${{ steps.linux-archive.outputs.version }}" \
            "${{ steps.linux-archive.outputs.file }}" \
            --clobber

      # ------------------------------------------------------------
      # Windows portable executable
      # ------------------------------------------------------------
      - name: Prepare Windows portable executable
        if: runner.os == 'Windows'
        id: windows-portable
        shell: pwsh
        run: |
          $config = Get-Content "modules/web-reader/src-tauri/tauri.conf.json" | ConvertFrom-Json
          $version = $config.version

          $source = "modules/web-reader/src-tauri/target/release/legado-reader.exe"
          $output = "Legado.Reader_${version}_windows-x64-portable.exe"

          if (-not (Test-Path $source)) {
            throw "Portable executable not found: $source"
          }

          Copy-Item $source $output

          Write-Host "Portable executable created:"
          Write-Host $output

          "version=$version" >> $env:GITHUB_OUTPUT
          "file=$output" >> $env:GITHUB_OUTPUT

      # ------------------------------------------------------------
      # Upload Windows portable executable
      # 上传到 tauri-action 创建的同一个 GitHub Release
      # ------------------------------------------------------------
      - name: Upload Windows portable executable
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload `
            "reader-v${{ steps.windows-portable.outputs.version }}" `
            "${{ steps.windows-portable.outputs.file }}" `
            --clobber
