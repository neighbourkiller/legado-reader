name: Publish Desktop Release

on:
  # 推送 reader-v* 标签时自动发布
  push:
    tags:
      - "reader-v*"

  # 也允许在 GitHub Actions 页面手动执行
  workflow_dispatch:
    inputs:
      release_tag:
        description: '已有 reader-v 标签；留空仅构建，不发布'
        required: false
        type: string

permissions:
  contents: read

jobs:
  prepare:
    name: Validate release identity
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.identity.outputs.version }}
      tag: ${{ steps.identity.outputs.tag }}
      commit: ${{ steps.identity.outputs.commit }}
      publish: ${{ steps.identity.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate version files and resolve tag
        id: identity
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node modules/web-reader/scripts/desktop-release.mjs prepare

  checks:
    needs: prepare
    uses: ./.github/workflows/check-web-reader.yml
    with:
      commit: ${{ needs.prepare.outputs.commit }}

  # ============================================================
  # Job 1: Build Linux artifacts (deb, rpm, tar.gz)
  # ============================================================
  build-linux:
    needs: [prepare, checks]
    name: Build (Linux x64)
    runs-on: ubuntu-22.04

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      # ------------------------------------------------------------
      # pnpm
      # ------------------------------------------------------------
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 9.15.9
          run_install: false

      # ------------------------------------------------------------
      # Node.js
      # ------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: modules/web-reader/pnpm-lock.yaml

      # ------------------------------------------------------------
      # Rust
      # ------------------------------------------------------------
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # ------------------------------------------------------------
      # Rust cache
      # ------------------------------------------------------------
      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            modules/web-reader/src-tauri -> target

      # ------------------------------------------------------------
      # Linux dependencies
      # Tauri 2 使用 WebKitGTK 4.1，打包 rpm 需要 rpm 工具
      # ------------------------------------------------------------
      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            rpm

      # ------------------------------------------------------------
      # Frontend dependencies
      # ------------------------------------------------------------
      - name: Install frontend dependencies
        working-directory: modules/web-reader
        run: pnpm install --frozen-lockfile

      # ------------------------------------------------------------
      # Build deb + rpm
      # ------------------------------------------------------------
      - name: Build Tauri bundles
        working-directory: modules/web-reader
        env:
          NO_STRIP: true
        run: pnpm tauri build --bundles deb,rpm

      # ------------------------------------------------------------
      # Rename and collect all Linux artifacts
      # ------------------------------------------------------------
      - name: Rename and collect artifacts
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          BUNDLE_DIR="modules/web-reader/src-tauri/target/release/bundle"
          BINARY="modules/web-reader/src-tauri/target/release/legado-reader"
          OUTPUT_DIR="release-artifacts"
          mkdir -p "$OUTPUT_DIR"

          # DEB: legado-reader_<ver>_amd64.deb → Legado.Reader_<ver>_linux-x64.deb
          cp "$BUNDLE_DIR/deb/legado-reader_${VERSION}_amd64.deb" \
             "$OUTPUT_DIR/Legado.Reader_${VERSION}_linux-x64.deb"

          # RPM: legado-reader-<ver>-1.x86_64.rpm → Legado.Reader_<ver>_linux-x64.rpm
          cp "$BUNDLE_DIR/rpm/legado-reader-${VERSION}-1.x86_64.rpm" \
             "$OUTPUT_DIR/Legado.Reader_${VERSION}_linux-x64.rpm"

          # tar.gz: 从 release binary 打包
          if [ ! -f "$BINARY" ]; then
            echo "::error::Binary not found: $BINARY"
            exit 1
          fi
          tar -czvf "$OUTPUT_DIR/Legado.Reader_${VERSION}_linux-x64.tar.gz" \
            -C "modules/web-reader/src-tauri/target/release" \
            legado-reader

          echo "=== Linux artifacts ==="
          ls -lh "$OUTPUT_DIR/"

      # ------------------------------------------------------------
      # Upload as GitHub Actions Artifact
      # ------------------------------------------------------------
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-artifacts
          path: release-artifacts/*
          if-no-files-found: error

  # ============================================================
  # Job 2: Build Windows artifacts (NSIS setup, portable zip)
  # ============================================================
  build-windows:
    needs: [prepare, checks]
    name: Build (Windows x64)
    runs-on: windows-latest

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      # ------------------------------------------------------------
      # pnpm
      # ------------------------------------------------------------
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 9.15.9
          run_install: false

      # ------------------------------------------------------------
      # Node.js
      # ------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: modules/web-reader/pnpm-lock.yaml

      # ------------------------------------------------------------
      # Rust
      # ------------------------------------------------------------
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # ------------------------------------------------------------
      # Rust cache
      # ------------------------------------------------------------
      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            modules/web-reader/src-tauri -> target

      # ------------------------------------------------------------
      # Frontend dependencies
      # ------------------------------------------------------------
      - name: Install frontend dependencies
        working-directory: modules/web-reader
        run: pnpm install --frozen-lockfile

      # ------------------------------------------------------------
      # Build NSIS installer
      # ------------------------------------------------------------
      - name: Build Tauri bundles
        working-directory: modules/web-reader
        run: pnpm tauri build --bundles nsis

      # ------------------------------------------------------------
      # Rename NSIS + create portable zip
      # ------------------------------------------------------------
      - name: Rename and collect artifacts
        shell: pwsh
        run: |
          $version = "${{ needs.prepare.outputs.version }}"
          $bundleDir = "modules/web-reader/src-tauri/target/release/bundle/nsis"
          $binaryPath = "modules/web-reader/src-tauri/target/release/legado-reader.exe"
          $outputDir = "release-artifacts"
          New-Item -ItemType Directory -Path $outputDir -Force | Out-Null

          # NSIS: legado-reader_<ver>_x64-setup.exe → Legado.Reader_<ver>_windows-x64-setup.exe
          Copy-Item "$bundleDir/legado-reader_${version}_x64-setup.exe" `
                     "$outputDir/Legado.Reader_${version}_windows-x64-setup.exe"

          # Portable ZIP
          if (-not (Test-Path $binaryPath)) {
            throw "Portable executable not found: $binaryPath"
          }
          $portableDir = Join-Path $outputDir "Legado.Reader_${version}_windows-x64-portable"
          New-Item -ItemType Directory -Path $portableDir -Force | Out-Null
          Copy-Item $binaryPath (Join-Path $portableDir "legado-reader.exe")
          Compress-Archive -LiteralPath $portableDir `
                           -DestinationPath "$outputDir/Legado.Reader_${version}_windows-x64-portable.zip" `
                           -CompressionLevel Optimal
          Remove-Item -Recurse -Force $portableDir

          Write-Host "=== Windows artifacts ==="
          Get-ChildItem $outputDir | Format-Table Name, Length

      # ------------------------------------------------------------
      # Upload as GitHub Actions Artifact
      # ------------------------------------------------------------
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-artifacts
          path: release-artifacts/*
          if-no-files-found: error

  # ============================================================
  # Job 3: Create Release and upload all artifacts
  # ============================================================
  release:
    name: Publish Release
    needs: [prepare, checks, build-linux, build-windows]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: desktop-release-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: '*-artifacts'
          path: all-artifacts
          merge-multiple: true
      - name: Publish verified draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: node modules/web-reader/scripts/desktop-release.mjs publish
