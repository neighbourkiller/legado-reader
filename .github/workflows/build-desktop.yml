name: Publish Desktop Release

on:
  # 推送 reader-v* 标签时自动发布
  push:
    tags:
      - "reader-v*"

  # 也允许在 GitHub Actions 页面手动执行
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Build (${{ matrix.name }})

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - name: Linux x64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""

          # Windows x86_64
          - name: Windows x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""

          # macOS Apple Silicon
          - name: macOS ARM64
            platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7

      # ------------------------------------------------------------
      # pnpm
      # ------------------------------------------------------------
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 9.15.9
          run_install: false

      # ------------------------------------------------------------
      # Node.js
      # ------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: modules/web-reader/pnpm-lock.yaml

      # ------------------------------------------------------------
      # Rust
      # ------------------------------------------------------------
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # ------------------------------------------------------------
      # Rust cache
      # ------------------------------------------------------------
      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            modules/web-reader/src-tauri -> target

      # ------------------------------------------------------------
      # Linux dependencies
      # Tauri 2 使用 WebKitGTK 4.1
      # ------------------------------------------------------------
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      # ------------------------------------------------------------
      # Frontend dependencies
      # ------------------------------------------------------------
      - name: Install frontend dependencies
        working-directory: modules/web-reader
        run: pnpm install --frozen-lockfile

      # ------------------------------------------------------------
      # Build Tauri + Publish GitHub Release
      # ------------------------------------------------------------
      - name: Build and publish desktop application
        uses: tauri-apps/tauri-action@v1.0.0

        env:
          # GitHub 自动提供，无需自己创建 Secret
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Linux AppImage 构建时禁止 strip
          # 避免部分 Runner / linuxdeploy 环境下 strip ELF 失败
          NO_STRIP: ${{ runner.os == 'Linux' && 'true' || '' }}

          # macOS 没有 Apple Developer Certificate 时
          # 使用 ad-hoc signing
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}

        with:
          # 当前仓库是 monorepo，Tauri 项目不在仓库根目录
          projectPath: modules/web-reader

          # __VERSION__ 自动读取 tauri.conf.json 中的 version
          #
          # 例如：
          # "version": "1.0.1"
          #
          # => reader-v1.0.1
          tagName: reader-v__VERSION__

          # GitHub Release 名称
          releaseName: "Legado Reader v__VERSION__"

          # 由 GitHub 自动生成 Release Notes
          generateReleaseNotes: true

          # false = 构建成功后直接公开发布
          # true  = 只创建 Draft，需要手动 Publish
          releaseDraft: false

          # 正式版
          prerelease: false

          # macOS ARM64 会传：
          # --target aarch64-apple-darwin
          #
          # Linux / Windows 为空，使用当前 Runner 默认 target
          args: ${{ matrix.args }}

      # ------------------------------------------------------------
      # Windows portable executable
      #
      # Tauri 构建结束后，Windows Runner 中会存在：
      #
      # modules/web-reader/src-tauri/target/release/legado-reader.exe
      #
      # 这个 exe 就是无需 MSI / NSIS 安装即可直接运行的程序。
      # ------------------------------------------------------------
      - name: Prepare Windows portable executable
        if: runner.os == 'Windows'
        id: windows-portable
        shell: pwsh
        run: |
          $config = Get-Content "modules/web-reader/src-tauri/tauri.conf.json" | ConvertFrom-Json
          $version = $config.version

          $source = "modules/web-reader/src-tauri/target/release/legado-reader.exe"
          $output = "Legado.Reader_${version}_windows-x64-portable.exe"

          if (-not (Test-Path $source)) {
            throw "Portable executable not found: $source"
          }

          Copy-Item $source $output

          Write-Host "Portable executable created:"
          Write-Host $output

          "version=$version" >> $env:GITHUB_OUTPUT
          "file=$output" >> $env:GITHUB_OUTPUT

      # ------------------------------------------------------------
      # Upload Windows portable executable
      # 上传到 tauri-action 创建的同一个 GitHub Release
      # ------------------------------------------------------------
      - name: Upload Windows portable executable
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload `
            "reader-v${{ steps.windows-portable.outputs.version }}" `
            "${{ steps.windows-portable.outputs.file }}" `
            --clobber