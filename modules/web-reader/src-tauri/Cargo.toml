[package]
name = "legado-reader"
version = "0.1.0"
edition = "2021"

[lib]
name = "legado_reader_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
reqwest = { version = "0.12", features = ["cookies", "gzip", "brotli", "deflate", "charset"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
log = "0.4"
keyring = "4.1.6"
quick-xml = "0.38"
httpdate = "1"
